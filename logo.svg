<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sidelight">
  <title>Sidelight</title>
  <defs><clipPath id="sq"><rect width="512" height="512" rx="104"/></clipPath></defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="#0c0a14"/>
    <line x1="110" y1="256" x2="402" y2="256" stroke="#241f35" stroke-width="20" stroke-linecap="round"/>
    <!-- one route, and no two hops holding the same value -->
    <circle cx="110" cy="256" r="52" fill="#0c0a14"/><circle cx="110" cy="256" r="40" fill="#22d3ee"/>
    <circle cx="207" cy="256" r="52" fill="#0c0a14"/><circle cx="207" cy="256" r="40" fill="#818cf8"/>
    <circle cx="305" cy="256" r="52" fill="#0c0a14"/><circle cx="305" cy="256" r="40" fill="#c084fc"/>
    <circle cx="402" cy="256" r="52" fill="#0c0a14"/><circle cx="402" cy="256" r="40" fill="#f472b6"/>
  </g>
</svg>
